<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบตรวจสอบราคาทุน - ราคาขาย</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-5xl mx-auto space-y-6">
    <!-- หัวข้อเว็บ -->
    <div class="bg-white rounded-2xl shadow-sm p-6 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-semibold text-slate-800">ระบบตรวจสอบราคาทุน - ราคาขาย</h1>
        <p class="text-sm text-slate-500">ค้นหาและอัปเดตราคาสินค้าแบบเรียลไทม์ผ่าน Google Sheets</p>
      </div>
      <button onclick="fetchProducts()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition">
        รีเฟรชข้อมูล
      </button>
    </div>

    <!-- ฟอร์มเพิ่มรายการสินค้า -->
    <div class="bg-white rounded-2xl shadow-sm p-6">
      <h2 class="text-lg font-medium text-slate-800 mb-4">เพิ่มรายการสินค้าใหม่</h2>
      <form id="productForm" class="grid grid-cols-1 md:grid-cols-6 gap-4">
        <input type="text" id="code" placeholder="รหัสสินค้า" required
          class="px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        <input type="text" id="name" placeholder="ชื่อสินค้า *" required
          class="md:col-span-2 px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        <input type="number" step="0.01" id="cost" placeholder="ราคาทุน *" required
          class="px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        <input type="number" step="0.01" id="price" placeholder="ราคาขาย *" required
          class="px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        <button type="submit" id="submitBtn"
          class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition">
          บันทึก
        </button>
        <input type="text" id="note" placeholder="หมายเหตุเพิ่มเติม (ถ้ามี)"
          class="md:col-span-6 px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
      </form>
      <div id="statusMsg" class="hidden mt-3 text-sm font-medium"></div>
    </div>

    <!-- ส่วนค้นหาและตารางแสดงราคา -->
    <div class="bg-white rounded-2xl shadow-sm p-6">
      <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-4">
        <h2 class="text-lg font-medium text-slate-800">รายการสินค้าทั้งหมด (<span id="itemCount">0</span>)</h2>
        <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="พิมพ์ค้นหา รหัส หรือ ชื่อสินค้า..."
          class="w-full md:w-72 px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-sm">
              <th class="py-3 px-4">รหัส</th>
              <th class="py-3 px-4">ชื่อสินค้า</th>
              <th class="py-3 px-4 text-right">ราคาทุน</th>
              <th class="py-3 px-4 text-right">ราคาขาย</th>
              <th class="py-3 px-4 text-right">กำไร/ชิ้น</th>
              <th class="py-3 px-4">หมายเหตุ</th>
              <th class="py-3 px-4 text-xs text-slate-400">อัปเดตล่าสุด</th>
            </tr>
          </thead>
          <tbody id="productTableBody" class="divide-y divide-slate-100 text-sm">
            <tr>
              <td colspan="7" class="py-8 text-center text-slate-400">กำลังโหลดข้อมูล...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxMbo-E3QSZ6NPsZuF5SL8E804_9WLNkn_8u-s_Bt1mEqV_13sdkB1CVA6zoikW1UH1/exec';
    let allProducts = [];

    // ดึงข้อมูลจาก Google Sheets มาแสดง
    async function fetchProducts() {
      const tbody = document.getElementById('productTableBody');
      tbody.innerHTML = '<tr><td colspan="7" class="py-8 text-center text-slate-400">กำลังโหลดข้อมูล...</td></tr>';
      
      try {
        const response = await fetch(WEB_APP_URL);
        const result = await response.json();
        if (result.status === 'success') {
          allProducts = result.data.reverse();
          renderTable(allProducts);
        }
      } catch (error) {
        tbody.innerHTML = '<tr><td colspan="7" class="py-8 text-center text-red-500">ไม่สามารถโหลดข้อมูลได้ กรุณาลองรีเฟรชอีกครั้ง</td></tr>';
      }
    }

    // แสดงผลลงตาราง
    function renderTable(items) {
      const tbody = document.getElementById('productTableBody');
      document.getElementById('itemCount').innerText = items.length;

      if (items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="py-8 text-center text-slate-400">ยังไม่มีข้อมูลสินค้า ลองเพิ่มรายการแรกด้านบนได้เลย!</td></tr>';
        return;
      }

      tbody.innerHTML = items.map(item => {
        const cost = Number(item.cost) || 0;
        const price = Number(item.price) || 0;
        const profit = price - cost;
        const profitColor = profit >= 0 ? 'text-emerald-600' : 'text-red-600';

        return `
          <tr class="hover:bg-slate-50 transition">
            <td class="py-3 px-4 font-medium text-slate-700">${item.code || '-'}</td>
            <td class="py-3 px-4 text-slate-800">${item.name || '-'}</td>
            <td class="py-3 px-4 text-right text-slate-600">${cost.toLocaleString('th-TH', {minimumFractionDigits: 2})}</td>
            <td class="py-3 px-4 text-right font-semibold text-blue-600">${price.toLocaleString('th-TH', {minimumFractionDigits: 2})}</td>
            <td class="py-3 px-4 text-right font-medium ${profitColor}">${profit.toLocaleString('th-TH', {minimumFractionDigits: 2})}</td>
            <td class="py-3 px-4 text-slate-500 text-xs">${item.note || '-'}</td>
            <td class="py-3 px-4 text-slate-400 text-xs">${item.updatedAt || '-'}</td>
          </tr>
        `;
      }).join('');
    }

    // ค้นหาสินค้าในตาราง
    function filterTable() {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allProducts.filter(item => 
        String(item.code).toLowerCase().includes(keyword) || 
        String(item.name).toLowerCase().includes(keyword)
      );
      renderTable(filtered);
    }

    // บันทึกข้อมูลใหม่ลง Google Sheets
    document.getElementById('productForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMsg');

      btn.disabled = true;
      btn.innerText = 'กำลังบันทึก...';

      const newProduct = {
        code: document.getElementById('code').value,
        name: document.getElementById('name').value,
        cost: document.getElementById('cost').value,
        price: document.getElementById('price').value,
        note: document.getElementById('note').value
      };

      try {
        await fetch(WEB_APP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(newProduct)
        });

        statusMsg.classList.remove('hidden', 'text-red-600');
        statusMsg.classList.add('text-emerald-600');
        statusMsg.innerText = 'บันทึกข้อมูลเรียบร้อยแล้ว!';
        document.getElementById('productForm').reset();
        
        setTimeout(() => {
          fetchProducts();
          statusMsg.classList.add('hidden');
        }, 1500);

      } catch (error) {
        statusMsg.classList.remove('hidden', 'text-emerald-600');
        statusMsg.classList.add('text-red-600');
        statusMsg.innerText = 'เกิดข้อผิดพลาดในการบันทึกข้อมูล';
      } finally {
        btn.disabled = false;
        btn.innerText = 'บันทึก';
      }
    });

    // โหลดข้อมูลทันทีเมื่อเปิดหน้าเว็บ
    fetchProducts();
  </script>
</body>
</html>
